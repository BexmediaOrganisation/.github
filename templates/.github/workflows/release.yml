# Release: release-please keeps a release PR ready. Merging it tags vX.Y.Z.
# Rules: Versioning and releases SOP. Runners: GitHub self-hosted runners SOP.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Get a key from Bexmedia Release Bot
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Update the release PR, or release if it was just merged
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Apps people download: to build after each release, remove the # from the lines
  # below and replace the echo with the repo's build steps. Pick the runs-on line for
  # the right computer (GitHub self-hosted runners SOP). To publish to the -Updates
  # repo, get the key with `owner` and `repositories` set to include it.
  # Docker apps and documentation repos: leave this as it is.
