# PR title check: every PR title must be a Conventional Commit.
# Rules: Commits and pull requests SOP. Runner: GitHub self-hosted runners SOP.
name: PR title check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
          requireScope: false
